<!DOCTYPE html>
<html>
<head>
    <title>EduManage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sidebar { width: 220px; min-height: 100vh; background: #1a2744; }
        .sidebar a { color: #adb5c6; text-decoration: none; display: block; padding: 10px 16px; border-radius: 6px; }
        .sidebar a:hover, .sidebar a.active { background: #2d3f6b; color: white; }
        .sidebar .brand { color: white; font-size: 1.2rem; font-weight: 600; padding: 20px 16px; border-bottom: 1px solid #2d3f6b; }
    </style>
</head>
<body class="bg-light">
<div class="d-flex">
    <div class="sidebar flex-shrink-0 p-2">
        <div class="brand">🎓 EduManage</div>
        <div class="mt-3">
            <a href="/" class="{% if request.path == '/' %}active{% endif %}">📊 Dashboard</a>
            <a href="/students/" class="{% if '/students/' in request.path %}active{% endif %}">👤 Students</a>
            <a href="/teachers/" class="{% if '/teachers/' in request.path %}active{% endif %}">🧑‍🏫 Teachers</a>
            <a href="/classes/" class="{% if '/classes/' in request.path %}active{% endif %}">📚 Classes</a>
            <a href="/subjects/" class="{% if '/subjects/' in request.path %}active{% endif %}">📖 Subjects</a>
            <a href="/attendance/" class="{% if '/attendance/' in request.path %}active{% endif %}">✅ Attendance</a>
            <a href="/grades/" class="{% if '/grades/' in request.path %}active{% endif %}">🏆 Grades</a>
            <a href="/announcements/" class="{% if '/announcements/' in request.path %}active{% endif %}">📢 Announcements</a>
        </div>
    </div>
    <div class="flex-grow-1 p-4">
        <h3 class="mb-4">{% block title %}{% endblock %}</h3>
        {% block content %}{% endblock %}
    </div>
</div>
</body>
</html>
